<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editorial Admin Studio | Syed Amjad Hussain</title>
  <meta name="theme-color" content="#472127">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Noto+Nastaliq+Urdu:wght@400;500&family=Noto+Serif+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Supabase JS Client & Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin-config.js"></script>

  <style>
    :root {
      --wine: #472127;
      --wine-dark: #30151b;
      --gold: #b99a61;
      --paper: #fbf8f2;
      --ink: #302327;
      --muted: #81777a;
      --border: #e6d9c8;
      --white: #fffdf8;
      --sans: "DM Sans", Arial, sans-serif;
      --serif: "Playfair Display", Georgia, serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.65;
    }

    .topline {
      height: 32px;
      background: var(--wine-dark);
      color: #e9ded0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5.5%;
      font-size: 9px;
      letter-spacing: .16em;
    }

    .site-header {
      padding: 25px 5.5% 15px;
      border-bottom: 1px solid var(--border);
      background: rgba(244, 239, 230, .96);
      text-align: center;
    }

    .site-header h1 {
      margin: 0 0 5px;
      font-family: var(--serif);
      color: var(--wine);
      font-size: 28px;
    }

    .site-header p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    main {
      max-width: 850px;
      margin: 30px auto;
      padding: 0 20px 60px;
    }

    .admin-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 30px;
    }

    .admin-btn {
      flex: 1 1 180px;
      padding: 12px 14px;
      background: white;
      border: 1px solid var(--gold);
      color: var(--wine);
      font-size: 12px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .admin-btn:hover, .admin-btn.active {
      background: var(--wine);
      color: white;
      border-color: var(--wine);
    }

    .admin-section {
      display: none;
      background: var(--white);
      border: 1px solid var(--gold);
      outline: 1px solid #d6c19c;
      outline-offset: -7px;
      padding: 30px 25px;
      box-shadow: 0 12px 32px rgba(48, 21, 27, 0.07);
    }

    .admin-section.active { display: block; }

    .admin-section h2 {
      margin-top: 0;
      font-family: var(--serif);
      color: var(--wine);
      font-size: 22px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    @media(max-width: 600px) {
      .form-row { grid-template-columns: 1fr; }
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 13px;
      color: var(--wine);
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: white;
      color: var(--ink);
      font: 14px var(--sans);
    }

    textarea.form-control {
      min-height: 100px;
      resize: vertical;
    }

    .submit-btn {
      padding: 12px 24px;
      background: var(--wine);
      color: white;
      border: none;
      border-radius: 3px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }

    .submit-btn:hover { background: var(--wine-dark); }

    .archive-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .archive-actions {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 3px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-edit { background: var(--gold); color: white; }
    .btn-delete { background: var(--wine); color: white; }
  </style>
</head>

<body>

<div class="topline">
  <span>EDITORIAL DASHBOARD</span>
  <span>SyedAmjadHussain.com</span>
</div>

<header class="site-header">
  <h1>Editorial Admin Studio</h1>
  <p>Content Manager & Heritage Suite</p>
</header>

<main>
  <div class="admin-nav">
    <button class="admin-btn active" type="button" onclick="switchTab('poetryStudio', this)">Poetry Studio</button>
    <button class="admin-btn" type="button" onclick="switchTab('sherStudio', this)">Sher Studio</button>
    <button class="admin-btn" type="button" onclick="switchTab('sufiStudio', this)">Sufi Saints Studio</button>
    <button class="admin-btn" type="button" onclick="switchTab('allContent', this)">All Archive</button>
  </div>

  <!-- Poetry Studio Section -->
  <section id="poetryStudio" class="admin-section active">
    <h2>Poetry Studio (Ghazal / Naat)</h2>
    <form id="poetryForm">
      <div class="form-group">
        <label for="poetryTitle">Main Title *</label>
        <input type="text" id="poetryTitle" class="form-control" required placeholder="Enter title">
      </div>

      <div class="form-group">
        <label for="poetryType">Record Type *</label>
        <select id="poetryType" class="form-control">
          <option value="Ghazal">Ghazal</option>
          <option value="Naat">Naat</option>
          <option value="Manqabat">Manqabat</option>
          <option value="Salam">Salam</option>
          <option value="Bait">Bait</option>
        </select>
      </div>

      <div class="form-group">
        <label for="poetryUrdu">Urdu Text (Nastaliq)</label>
        <textarea id="poetryUrdu" class="form-control" dir="rtl" placeholder="اردو متن..."></textarea>
      </div>

      <div class="form-group">
        <label for="poetryHindi">Hindi Text (Devanagari)</label>
        <textarea id="poetryHindi" class="form-control" placeholder="हिंदी टेक्स्ट..."></textarea>
      </div>

      <div class="form-group">
        <label for="poetryRoman">Roman Urdu Text</label>
        <textarea id="poetryRoman" class="form-control" placeholder="Roman text..."></textarea>
      </div>

      <button type="submit" id="poetrySaveBtn" class="submit-btn">Save Poetry</button>
      <button type="button" id="poetryCancelBtn" class="submit-btn" style="background:#81777a; display:none; margin-left:10px;" onclick="resetPoetryForm()">Cancel Edit</button>
    </form>
  </section>

  <!-- Sher Studio Section -->
  <section id="sherStudio" class="admin-section">
    <h2>Sher Studio (Single Couplets)</h2>
    <form id="sherForm">
      <div class="form-group">
        <label for="sherCategory">Category *</label>
        <select id="sherCategory" class="form-control">
          <option value="Life">Life</option>
          <option value="Love">Love</option>
          <option value="Sufi">Sufi</option>
          <option value="Reflection">Reflection</option>
        </select>
      </div>

      <div class="form-group">
        <label for="sherUrdu">Urdu Couplet</label>
        <textarea id="sherUrdu" class="form-control" dir="rtl" placeholder="اردو شعر..."></textarea>
      </div>

      <div class="form-group">
        <label for="sherHindi">Hindi Couplet</label>
        <textarea id="sherHindi" class="form-control" placeholder="हिंदी शेर..."></textarea>
      </div>

      <div class="form-group">
        <label for="sherRoman">Roman Urdu Couplet</label>
        <textarea id="sherRoman" class="form-control" placeholder="Roman couplet..."></textarea>
      </div>

      <button type="submit" id="sherSaveBtn" class="submit-btn">Save Sher</button>
      <button type="button" id="sherCancelBtn" class="submit-btn" style="background:#81777a; display:none; margin-left:10px;" onclick="resetSherForm()">Cancel Edit</button>
    </form>
  </section>

  <!-- Sufi Saints Studio Section (Matching sufi-heritage.html fields) -->
  <section id="sufiStudio" class="admin-section">
    <h2>Sufi Saints Studio</h2>
    <form id="sufiForm">
      <div class="form-group">
        <label for="saintName">Saint Name *</label>
        <input type="text" id="saintName" class="form-control" required placeholder="e.g., Hazrat Makhdoom Yahya Maneri">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="shrineLocation">Location / Shrine *</label>
          <input type="text" id="shrineLocation" class="form-control" required placeholder="e.g., Maner Sharif">
        </div>
        <div class="form-group">
          <label for="eraCentury">Era / Century</label>
          <input type="text" id="eraCentury" class="form-control" placeholder="e.g., 13th Century">
        </div>
      </div>

      <div class="form-group">
        <label for="saintDesc">Description *</label>
        <textarea id="saintDesc" class="form-control" required placeholder="A brief spiritual description of the saint..."></textarea>
      </div>

      <div class="form-group">
        <label for="saintLink">Profile Link / Path</label>
        <input type="text" id="saintLink" class="form-control" placeholder="e.g., saints/makhdoom-yahya-maneri.html">
      </div>

      <button type="submit" id="sufiSaveBtn" class="submit-btn">Save Saint Record</button>
      <button type="button" id="sufiCancelBtn" class="submit-btn" style="background:#81777a; display:none; margin-left:10px;" onclick="resetSufiForm()">Cancel Edit</button>
    </form>
  </section>

  <!-- All Archive Section -->
  <section id="allContent" class="admin-section">
    <h2>All Content Archive</h2>
    
    <h3 style="color:var(--wine); font-size:15px; margin-top:10px;">Poetry Archive</h3>
    <div id="poetryArchiveContainer"><p style="color:var(--muted); font-size:12px;">Loading...</p></div>

    <br><hr style="border-top: 1px solid var(--border);"><br>
    
    <h3 style="color:var(--wine); font-size:15px;">Sher Archive</h3>
    <div id="sherArchiveContainer"><p style="color:var(--muted); font-size:12px;">Loading...</p></div>

    <br><hr style="border-top: 1px solid var(--border);"><br>

    <h3 style="color:var(--wine); font-size:15px;">Sufi Saints Archive</h3>
    <div id="sufiArchiveContainer"><p style="color:var(--muted); font-size:12px;">Loading...</p></div>
  </section>
</main>

<script>
  let editingPoetryId = null;
  let editingSherId = null;
  let editingSufiId = null;

  function getClient() {
    return supabase.createClient(window.ADMIN_CONFIG.supabaseUrl, window.ADMIN_CONFIG.supabaseAnonKey);
  }

  function switchTab(tabId, element) {
    document.querySelectorAll('.admin-section').forEach(sec => sec.classList.remove('active'));
    document.querySelectorAll('.admin-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    element.classList.add('active');
    if (tabId === 'allContent') loadArchives();
  }

  function escapeHTML(val = "") {
    return String(val).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  }

  // Poetry Submission
  document.getElementById('poetryForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const data = {
      title: document.getElementById('poetryTitle').value.trim(),
      type: document.getElementById('poetryType').value,
      urdu_text: document.getElementById('poetryUrdu').value,
      hindi_text: document.getElementById('poetryHindi').value,
      roman_text: document.getElementById('poetryRoman').value
    };
    try {
      const client = getClient();
      const res = editingPoetryId ? await client.from('poetry').update(data).eq('id', editingPoetryId) : await client.from('poetry').insert([data]);
      if (res.error) throw res.error;
      alert(editingPoetryId ? "Poetry updated!" : "Poetry saved!");
      resetPoetryForm();
      loadArchives();
    } catch(err) { alert("Error: " + err.message); }
  });

  // Sher Submission
  document.getElementById('sherForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const data = {
      category: document.getElementById('sherCategory').value,
      sher_urdu: document.getElementById('sherUrdu').value,
      sher_hindi: document.getElementById('sherHindi').value,
      sher_roman: document.getElementById('sherRoman').value,
      language: 'Roman Urdu'
    };
    try {
      const client = getClient();
      const res = editingSherId ? await client.from('sher').update(data).eq('id', editingSherId) : await client.from('sher').insert([data]);
      if (res.error) throw res.error;
      alert(editingSherId ? "Sher updated!" : "Sher saved!");
      resetSherForm();
      loadArchives();
    } catch(err) { alert("Error: " + err.message); }
  });

  // Sufi Saint Submission (Updated with exact matching fields)
  document.getElementById('sufiForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const data = {
      saint_name: document.getElementById('saintName').value.trim(),
      shrine_location: document.getElementById('shrineLocation').value.trim(),
      era_century: document.getElementById('eraCentury').value.trim(),
      roman_desc: document.getElementById('saintDesc').value.trim(),
      roman_desc_link: document.getElementById('saintLink').value.trim()
    };
    try {
      const client = getClient();
      const res = editingSufiId ? await client.from('sufi_saints').update(data).eq('id', editingSufiId) : await client.from('sufi_saints').insert([data]);
      if (res.error) throw res.error;
      alert(editingSufiId ? "Saint record updated!" : "Saint record saved!");
      resetSufiForm();
      loadArchives();
    } catch(err) { alert("Error: " + err.message); }
  });

  // Load Archives
  async function loadArchives() {
    const client = getClient();
    
    // Poetry
    const { data: pData } = await client.from('poetry').select('*').order('id', { ascending: false });
    document.getElementById('poetryArchiveContainer').innerHTML = !pData || !pData.length ? `<p style="color:var(--muted); font-size:12px;">No poetry records.</p>` : pData.map(item => `
      <div class="archive-item">
        <div><strong>${escapeHTML(item.title)}</strong> <small>(${escapeHTML(item.type)})</small></div>
        <div class="archive-actions">
          <button class="btn-action btn-edit" onclick="editPoetry(${item.id})">Edit</button>
          <button class="btn-action btn-delete" onclick="delRecord('poetry', ${item.id})">Delete</button>
        </div>
      </div>
    `).join('');

    // Sher
    const { data: sData } = await client.from('sher').select('*').order('id', { ascending: false });
    document.getElementById('sherArchiveContainer').innerHTML = !sData || !sData.length ? `<p style="color:var(--muted); font-size:12px;">No sher records.</p>` : sData.map(item => `
      <div class="archive-item">
        <div><strong>${escapeHTML((item.sher_roman || item.sher_urdu || '').slice(0, 35))}...</strong> <small>(${escapeHTML(item.category)})</small></div>
        <div class="archive-actions">
          <button class="btn-action btn-edit" onclick="editSher(${item.id})">Edit</button>
          <button class="btn-action btn-delete" onclick="delRecord('sher', ${item.id})">Delete</button>
        </div>
      </div>
    `).join('');

    // Sufi Saints
    const { data: sufiData } = await client.from('sufi_saints').select('*').order('id', { ascending: false });
    document.getElementById('sufiArchiveContainer').innerHTML = !sufiData || !sufiData.length ? `<p style="color:var(--muted); font-size:12px;">No sufi saint records.</p>` : sufiData.map(item => `
      <div class="archive-item">
        <div><strong>${escapeHTML(item.saint_name)}</strong> <small>(${escapeHTML(item.shrine_location || '')})</small></div>
        <div class="archive-actions">
          <button class="btn-action btn-edit" onclick="editSufi(${item.id})">Edit</button>
          <button class="btn-action btn-delete" onclick="delRecord('sufi_saints', ${item.id})">Delete</button>
        </div>
      </div>
    `).join('');
  }

  async function editPoetry(id) {
    const { data } = await getClient().from('poetry').select('*').eq('id', id).single();
    if (data) {
      document.getElementById('poetryTitle').value = data.title || '';
      document.getElementById('poetryType').value = data.type || 'Ghazal';
      document.getElementById('poetryUrdu').value = data.urdu_text || '';
      document.getElementById('poetryHindi').value = data.hindi_text || '';
      document.getElementById('poetryRoman').value = data.roman_text || '';
      editingPoetryId = id;
      document.getElementById('poetrySaveBtn').textContent = 'Update Poetry';
      document.getElementById('poetryCancelBtn').style.display = 'inline-block';
      switchTab('poetryStudio', document.querySelectorAll('.admin-btn')[0]);
    }
  }

  async function editSher(id) {
    const { data } = await getClient().from('sher').select('*').eq('id', id).single();
    if (data) {
      document.getElementById('sherCategory').value = data.category || 'Life';
      document.getElementById('sherUrdu').value = data.sher_urdu || '';
      document.getElementById('sherHindi').value = data.sher_hindi || '';
      document.getElementById('sherRoman').value = data.sher_roman || '';
      editingSherId = id;
      document.getElementById('sherSaveBtn').textContent = 'Update Sher';
      document.getElementById('sherCancelBtn').style.display = 'inline-block';
      switchTab('sherStudio', document.querySelectorAll('.admin-btn')[1]);
    }
  }

  async function editSufi(id) {
    const { data } = await getClient().from('sufi_saints').select('*').eq('id', id).single();
    if (data) {
      document.getElementById('saintName').value = data.saint_name || '';
      document.getElementById('shrineLocation').value = data.shrine_location || '';
      document.getElementById('eraCentury').value = data.era_century || '';
      document.getElementById('saintDesc').value = data.roman_desc || '';
      document.getElementById('saintLink').value = data.roman_desc_link || '';
      editingSufiId = id;
      document.getElementById('sufiSaveBtn').textContent = 'Update Saint Record';
      document.getElementById('sufiCancelBtn').style.display = 'inline-block';
      switchTab('sufiStudio', document.querySelectorAll('.admin-btn')[2]);
    }
  }

  async function delRecord(table, id) {
    if (!confirm("Are you sure you want to delete this record?")) return;
    await getClient().from(table).delete().eq('id', id);
    alert("Deleted successfully!");
    loadArchives();
  }

  function resetPoetryForm() {
    document.getElementById('poetryForm').reset();
    editingPoetryId = null;
    document.getElementById('poetrySaveBtn').textContent = 'Save Poetry';
    document.getElementById('poetryCancelBtn').style.display = 'none';
  }
  function resetSherForm() {
    document.getElementById('sherForm').reset();
    editingSherId = null;
    document.getElementById('sherSaveBtn').textContent = 'Save Sher';
    document.getElementById('sherCancelBtn').style.display = 'none';
  }
  function resetSufiForm() {
    document.getElementById('sufiForm').reset();
    editingSufiId = null;
    document.getElementById('sufiSaveBtn').textContent = 'Save Saint Record';
    document.getElementById('sufiCancelBtn').style.display = 'none';
  }
</script>
</body>
</html>
