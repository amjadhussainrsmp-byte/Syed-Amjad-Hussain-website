<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Studio | SyedAmjadHussain.com</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #fbf9f5;
      --card-bg: #ffffff;
      --accent-brown: #9a6b38;
      --text-dark: #222222;
      --text-muted: #666666;
      --border-color: #e5dec9;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-dark); padding: 20px; }
    
    .container { max-width: 800px; margin: 0 auto; }
    
    header { margin-bottom: 24px; text-align: center; }
    header h1 { font-size: 26px; font-weight: 700; color: var(--text-dark); }
    header p { color: var(--text-muted); font-size: 14px; }

    /* Nav Buttons Tabs */
    .tab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin-bottom: 24px;
    }

    .tab-btn {
      background: #ffffff;
      border: 1px solid var(--border-color);
      padding: 14px 18px;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      color: var(--text-dark);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tab-btn:hover { background: #f4efe4; }
    
    .tab-btn.active {
      background: var(--accent-brown);
      color: #ffffff;
      border-color: var(--accent-brown);
      box-shadow: 0 4px 12px rgba(154, 107, 56, 0.2);
    }

    /* Dynamic Form Card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .card-header { margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
    .card-header h2 { font-size: 20px; color: var(--accent-brown); }
    .card-header p { font-size: 13px; color: var(--text-muted); }

    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .form-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background: #fafafa;
    }
    .form-input:focus { border-color: var(--accent-brown); background: #ffffff; }

    textarea.form-input { resize: vertical; min-height: 90px; }

    .btn-submit {
      width: 100%;
      background: var(--accent-brown);
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-submit:hover { opacity: 0.9; }

    #content-list { margin-top: 15px; }
    .item-row { padding: 12px; border-bottom: 1px solid var(--border-color); }
  </style>

  <!-- Supabase JS Client & Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin-config.js"></script>
</head>
<body>

  <div class="container">
    <header>
      <h1>Editorial Admin Studio</h1>
      <p>SyedAmjadHussain.com Content Manager</p>
    </header>

    <!-- Workspace Selector Tabs -->
    <div class="tab-grid">
      <button class="tab-btn active" onclick="switchCategory('poetry', this)">Poetry Studio</button>
      <button class="tab-btn" onclick="switchCategory('sher', this)">Sher Collection</button>
      <button class="tab-btn" onclick="switchCategory('awards', this)">Awards & Honours</button>
      <button class="tab-btn" onclick="switchCategory('books', this)">Books</button>
      <button class="tab-btn" onclick="switchCategory('articles', this)">Articles</button>
      <button class="tab-btn" onclick="switchCategory('sufi', this)">Sufi Heritage</button>
      <button class="tab-btn" onclick="switchCategory('all', this)">All Content</button>
    </div>

    <!-- Form Container -->
    <div class="card" id="form-card">
      <div class="card-header">
        <h2 id="form-title">Poetry Studio</h2>
        <p id="form-desc">Add a ghazal, naat, manqabat, bait, or salam in Urdu, Hindi, and Roman script.</p>
      </div>

      <form id="admin-form" onsubmit="handleFormSubmit(event)">
        <!-- Dynamic Fields Inject Here -->
        <div id="dynamic-fields"></div>
        <button type="submit" class="btn-submit" id="submit-btn">Save to Archive</button>
      </form>
    </div>
  </div>

  <!-- Main Logic JS -->
  <script src="admin-assets/admin.js"></script>
</body>
</html>
